name: Build N1-SmartHub-OS (Kernel 6.1.y LTS)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      kernel:
        description: 'Amlogic Kernel Version (LTS 稳定推荐 6.1.y)'
        required: true
        default: '6.1.y'
      board:
        description: 'Target Board (斐讯 N1 S905D)'
        required: true
        default: 's905d'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: openwrt-23.05
  CONFIG_FILE: config/n1-smarthub.config
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Disk Space (Ubuntu Runner)
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune -a -f || true
        sudo -E apt-get -qq update
        sudo -E apt-get -qq full-upgrade -y
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
          libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
          python3-pip libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev pigz
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        df -h

    - name: Clone Source Code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: Cache DL Packages
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: ${{ runner.os }}-openwrt-dl-${{ hashFiles('config/n1-smarthub.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-dl-

    - name: Load Custom Feeds & Scripts (Part 1)
      run: |
        [ -e $DIY_P1_SH ] && chmod +x $DIY_P1_SH && $DIY_P1_SH
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Config & Files (Part 2)
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        [ -e $DIY_P2_SH ] && chmod +x $DIY_P2_SH && cd openwrt && ../$DIY_P2_SH && cd ..
        cd openwrt
        make defconfig
        if [ -d "../files" ]; then
          echo "Injecting custom overlay into openwrt/files..."
          mkdir -p files
          cp -r ../files/* files/
          chmod +x files/root/*.sh 2>/dev/null || true
          chmod +x files/usr/bin/* 2>/dev/null || true
          chmod +x files/www/cgi-bin/* 2>/dev/null || true
          chmod +x files/etc/uci-defaults/* 2>/dev/null || true
        fi

    - name: Download DL Packages
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Rootfs
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Package Amlogic S905D Firmware
      if: steps.compile.outputs.status == 'success'
      uses: ophub/amlogic-s9xxx-openwrt@main
      with:
        openwrt_path: openwrt/bin/targets/*/*/*rootfs.tar.gz
        openwrt_board: ${{ github.event.inputs.board || 's905d' }}
        openwrt_kernel: ${{ github.event.inputs.kernel || '6.1.y' }}
        auto_kernel: false
        openwrt_ip: 192.168.1.149
        kernel_repo: ophub/kernel
        output_name: N1-SmartHub-OS

    - name: Generate Checksums & Release Metadata
      id: meta
      if: steps.compile.outputs.status == 'success'
      run: |
        cd ${{ env.PACKAGED_OUTPUTPATH }}
        sha256sum *.img.gz > sha256sums.txt 2>/dev/null || true
        md5sum *.img.gz > md5sums.txt 2>/dev/null || true
        echo "release_tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
        echo "release_date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

    - name: Upload Firmware to Artifacts
      uses: actions/upload-artifact@v4
      if: env.UPLOAD_FIRMWARE == 'true'
      with:
        name: N1-SmartHub-OS-Firmware
        path: ${{ env.PACKAGED_OUTPUTPATH }}/*

    - name: Create GitHub Release
      id: release
      uses: softprops/action-gh-release@v2
      if: env.UPLOAD_RELEASE == 'true'
      with:
        tag_name: ${{ steps.meta.outputs.release_tag }}
        name: N1-SmartHub-OS 专属固件 (${{ steps.meta.outputs.release_date }})
        body: |
          ### 🚀 N1-SmartHub-OS 专属固件构建成功！
          * **编译时间**：${{ steps.meta.outputs.release_date }}
          * **硬件目标**：斐讯 N1 (Amlogic S905D 四核 A53)
          * **底层内核**：Linux 6.1.y LTS 长期支持稳定版
          * **系统亮点**：
            - ✅ 纯净极简，系统自身待机仅占用 ~100MB 内存
            - ✅ 原生预装 Docker CE 容器环境及管理面板
            - ✅ 固化 Hysteria 2 / Xray / Sing-box / FRP 远程穿透
            - ✅ 内置 Cloudflare 优质 Clean IP 多线程并发测速与自愈看门狗
            - ✅ 开机直出现代化自研 N1 OS Web 控制台（支持手机端与电脑自适应）
            - ✅ 默认 LAN IP: `192.168.1.149`，开机预置电脑 SSH 密钥免密登录
          * **刷机说明**：
            1. 下载下方 `.img.gz` 固件压缩包，解压得到 `.img` 镜像；
            2. 使用 Rufus 或 balenaEtcher 写入普通 U 盘（≥4GB）；
            3. 将 U 盘插入 N1 靠近 HDMI 口的 USB，接通电源即可启动测试；
            4. 体验满意后，SSH 连接 `ssh root@192.168.1.149` 输入 `openwrt-install-to-emmc` 即可固化至内部闪存。
        files: ${{ env.PACKAGED_OUTPUTPATH }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
